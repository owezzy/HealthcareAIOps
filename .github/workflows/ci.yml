name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: aiops
          POSTGRES_DB: aiops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiops -d aiops_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      AIOPS_TEST_DATABASE_URL: postgresql+psycopg://aiops:aiops@localhost:5432/aiops_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check packages services
      - run: uv run ruff format --check packages services
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Lint (root ESLint tooling)
        run: npm ci && npm run lint
      - name: Build Angular app
        working-directory: apps/web
        run: npm ci && npm run build
      - name: Type-check Copilot runtime
        working-directory: services/copilot-runtime
        run: npm ci && npm run typecheck

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the demo overlay
        run: kubectl kustomize deploy/overlays/demo > /dev/null
