name: Images

# develop builds tag the commit SHA; release tags (vX.Y.Z, git flow) also tag X.Y.Z,
# which the demo overlay pins and Flux deploys (ADR-0009).
on:
  push:
    branches: [develop]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., dockerfile: services/api/Dockerfile }
          - { name: agent, context: ., dockerfile: services/agent/Dockerfile }
          - { name: copilot-runtime, context: services/copilot-runtime, dockerfile: services/copilot-runtime/Dockerfile }
          - { name: web, context: apps/web, dockerfile: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/healthcare-aiops-${{ matrix.name }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
