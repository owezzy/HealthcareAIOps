# Single public entry point (ADR-0012). Upstream hostnames are Kubernetes
# service DNS names in the aiops-app namespace.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Browser-facing AG-UI stream: no buffering, long-lived responses.
    location /api/copilotkit {
        proxy_pass http://copilot-runtime.aiops-app.svc.cluster.local:4000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public API routes only. /internal/* is deliberately not routed.
    location /api/ {
        proxy_pass http://api.aiops-app.svc.cluster.local:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
