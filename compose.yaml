# Local development services. `make db` starts Postgres; `make migrate` applies the schema.
# Credentials are for local development only.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
      POSTGRES_DB: aiops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
