# LLM prices in USD per million tokens, keyed by the model ID the provider
# reports in its responses (LangChain response_metadata["model_name"]).
#
# Fill these from each provider's published price list when ADR-0008 pins the
# exact OpenAI, DeepSeek and Qwen model versions. A model with no entry is
# recorded with cost_usd = null: cost is shown as unknown, never guessed.
#
# Example shape:
#   models:
#     <model-id>:
#       input_per_million_usd: 0.00
#       output_per_million_usd: 0.00
models:
  # Local fake (AIOPS_LLM_MODEL=fake:echo): costs nothing, so the budget stays known.
  fake-echo:
    input_per_million_usd: 0
    output_per_million_usd: 0
  # NVIDIA Nemotron 3 Nano 4B running locally in Ollama: no per-token charge.
  nemotron-3-nano:4b:
    input_per_million_usd: 0
    output_per_million_usd: 0
