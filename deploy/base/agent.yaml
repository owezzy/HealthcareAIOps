apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: aiops-app
spec:
  selector: { app: agent }
  ports: [{ name: http, port: 8123 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: aiops-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: agent }
  template:
    metadata:
      labels: { app: agent }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: agent
          image: healthcare-aiops-agent
          ports: [{ name: http, containerPort: 8123 }]
          # Optional secret aiops-llm: AIOPS_LLM_MODEL plus the provider API keys.
          # Without it the agent runs the keyless fake:echo model.
          envFrom:
            - secretRef: { name: aiops-llm, optional: true }
          env:
            - { name: AIOPS_API_URL, value: "http://api.aiops-app.svc.cluster.local:8000" }
            - name: AIOPS_INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: aiops-secrets, key: AIOPS_INTERNAL_TOKEN } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
