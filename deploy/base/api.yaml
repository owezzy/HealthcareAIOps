apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aiops-app
spec:
  selector: { app: api }
  ports: [{ name: http, port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aiops-app
spec:
  # One replica: the migration init container is not safe to run concurrently.
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext: { runAsNonRoot: true }
      initContainers:
        - name: migrate
          image: healthcare-aiops-api
          workingDir: /app/services/api
          command: ["alembic", "upgrade", "head"]
          envFrom: [{ secretRef: { name: aiops-secrets } }]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 192Mi }
      containers:
        - name: api
          image: healthcare-aiops-api
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ secretRef: { name: aiops-secrets } }]
          env:
            - { name: AIOPS_DAILY_LLM_BUDGET_USD, value: "5" }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
