# Publishes the web service through a Cloudflare Tunnel (ADR-0012). In the
# Cloudflare dashboard, route the hostname to http://web.aiops-app.svc.cluster.local:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: aiops-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532 }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: cloudflared-token, key: token } }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
