apiVersion: v1
kind: Service
metadata:
  name: copilot-runtime
  namespace: aiops-app
spec:
  selector: { app: copilot-runtime }
  ports: [{ name: http, port: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-runtime
  namespace: aiops-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: copilot-runtime }
  template:
    metadata:
      labels: { app: copilot-runtime }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: copilot-runtime
          image: healthcare-aiops-copilot-runtime
          ports: [{ name: http, containerPort: 4000 }]
          env:
            - { name: AGENT_URL, value: "http://agent.aiops-app.svc.cluster.local:8123/agent" }
          readinessProbe:
            httpGet: { path: /api/copilotkit/info, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false }
