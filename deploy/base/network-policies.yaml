# Least-privilege traffic (plan §7). Only cloudflared reaches web; only web
# reaches runtime and api; only runtime reaches the agent. The agent may call
# the API (usage) and the internet (model APIs). Postgres lives in the shared
# `postgres` namespace (ADR-0012), outside these policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: web-from-cloudflared, namespace: aiops-app }
spec:
  podSelector: { matchLabels: { app: web } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: { matchLabels: { app: cloudflared } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-from-web, namespace: aiops-app }
spec:
  podSelector: { matchLabels: { app: copilot-runtime } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: { matchLabels: { app: web } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: agent-from-runtime, namespace: aiops-app }
spec:
  podSelector: { matchLabels: { app: agent } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: { matchLabels: { app: copilot-runtime } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-from-web-and-agent, namespace: aiops-app }
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: web } }
        - podSelector: { matchLabels: { app: agent } }
