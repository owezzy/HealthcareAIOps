[project]
name = "aiops-api"
version = "0.1.0"
description = "Domain API: auth, incidents, approvals, audit, alert ingestion."
requires-python = ">=3.14"
dependencies = [
    "aiops-contracts",
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
aiops-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
