[project]
name = "aiops-sim"
version = "0.1.0"
description = "Simulated healthcare estate: demo services, fault toggles, manifests."
requires-python = ">=3.14"
dependencies = [
    "aiops-contracts",
    "fastapi>=0.115",
    "httpx>=0.28",
    "prometheus-client>=0.21",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
aiops-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
